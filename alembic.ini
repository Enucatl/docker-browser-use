# Alembic configuration for browser-use audit schema migrations.
# Prefer: python -m browser_use_agent.db.migrate
# Or: DATABASE_* env + alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden at runtime by migrate.py / env.py from DATABASE_* settings.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
