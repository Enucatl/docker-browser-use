services:
  controller:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
    image: ghcr.io/enucatl/browser-use:latest
    cpu_shares: 512
    extra_hosts:
      - "${DOCKER_DOMAIN}:host-gateway"
      - "docker-host.internal:host-gateway"
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - BROWSER_USE_HOST=browser-use.${DOCKER_DOMAIN}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-browser_use}
      - DATABASE_USER=${DATABASE_USER:-browser_use}
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.browser-use.rule=Host(`browser-use.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.browser-use.entrypoints=https"
      - "traefik.http.routers.browser-use.tls=true"
      - "traefik.http.routers.browser-use.middlewares=authelia@docker,secured@file"
      - "traefik.http.services.browser-use.loadbalancer.server.port=8000"
    ports: []
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,noexec,mode=1777,size=16m
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    secrets:
      - postgres_password
    networks:
      - traefik_proxy
      - default
    depends_on:
      db:
        condition: service_healthy

  db:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - POSTGRES_DB=${DATABASE_NAME:-browser_use}
      - POSTGRES_USER=${DATABASE_USER:-browser_use}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
    secrets:
      - postgres_password
    networks:
      - default

secrets:
  postgres_password:
    file: ./secrets/postgres_password

networks:
  default:
    internal: true
  traefik_proxy:
    external: true

volumes:
  pgdata:
