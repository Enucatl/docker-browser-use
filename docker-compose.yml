services:
  controller:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/enucatl/browser-use:latest
    cpu_shares: 512
    extra_hosts:
      - "${DOCKER_DOMAIN}:host-gateway"
      - "docker-host.internal:host-gateway"
    environment:
      - TZ=Europe/Zurich
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - BROWSER_USE_HOST=browser-use.${DOCKER_DOMAIN}
      # Prod: require Authelia Remote-User; trusted host/origin match Traefik.
      # Do not set AUTH_REQUIRED=false here — local pytest defaults to false.
      - AUTH_REQUIRED=true
      - ALLOWED_HOSTS=browser-use.${DOCKER_DOMAIN},localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://browser-use.${DOCKER_DOMAIN}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=browser_use
      - DATABASE_USER=browser_use
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      # T035 signed audit checkpoints; private key is signing-only, public keys verify.
      - AUDIT_SIGNING_KEY_FILE=/run/secrets/audit_signing_key
      - AUDIT_SIGNING_PUBLIC_KEY_FILE=/run/secrets/audit_signing_public_key
      - AUDIT_SIGNING_KEY_ID=${AUDIT_SIGNING_KEY_ID:-default}
      - AUDIT_CHECKPOINT_INTERVAL=${AUDIT_CHECKPOINT_INTERVAL:-10}
      # Content-addressed blobs; not exposed via Traefik (see docs/artifacts.md).
      - ARTIFACT_STORE=${ARTIFACT_STORE:-fs}
      - ARTIFACTS_ROOT=/var/lib/browser-use/artifacts
      - ARTIFACT_S3_ENDPOINT_URL=${ARTIFACT_S3_ENDPOINT_URL:-http://minio:9000}
      - ARTIFACT_S3_BUCKET=${ARTIFACT_S3_BUCKET:-browser-use-artifacts}
      - ARTIFACT_S3_PREFIX=${ARTIFACT_S3_PREFIX:-}
      - ARTIFACT_S3_REGION=${ARTIFACT_S3_REGION:-us-east-1}
      - ARTIFACT_S3_ACCESS_KEY_FILE=/run/secrets/minio_access_key
      - ARTIFACT_S3_SECRET_KEY_FILE=/run/secrets/minio_secret_key
      - ARTIFACT_S3_SSE=${ARTIFACT_S3_SSE:-}
      # Browser Use session manager (T013): CDP is Compose-internal only.
      - BROWSER_IDLE_TTL_SECONDS=300
      - BROWSER_PROFILE_NAME=default
      - BROWSER_PROFILE_ROOT=/data/chrome-profiles
      - BROWSER_PROFILE_IDS=default,testing
      - BROWSER_PROFILE_CDP_URLS=default=http://browser:9222,testing=http://browser-test:9222
      # Optional: start/stop the browser service via docker CLI (needs socket mount).
      - BROWSER_COMPOSE_CONTROL=false
      - BROWSER_STOP_ON_IDLE=false
      # Decision / text-fill providers (keys via Docker secrets; never env literals).
      - JEV_BASE_URL=${JEV_BASE_URL:-https://api.typesafe.ai}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
      - JEV_TIMEOUT_SECONDS=${JEV_TIMEOUT_SECONDS:-30}
      - JEV_API_KEY_FILE=/run/secrets/jev_api_key
      - TEXT_LLM_BASE_URL=${TEXT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - TEXT_LLM_MODEL=${TEXT_LLM_MODEL:-gpt-4.1-mini}
      - TEXT_LLM_MAX_TOKENS=${TEXT_LLM_MAX_TOKENS:-64}
      - TEXT_LLM_API_KEY_FILE=/run/secrets/openrouter_api_key
      # Optional OTLP/HTTP export; an empty endpoint keeps telemetry local/off.
      - OTEL_ENABLED=${OTEL_ENABLED:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-browser-use-agent}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.browser-use.rule=Host(`browser-use.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.browser-use.entrypoints=https"
      - "traefik.http.routers.browser-use.tls=true"
      - "traefik.http.routers.browser-use.middlewares=authelia@docker,secured@file"
      - "traefik.http.services.browser-use.loadbalancer.server.port=8000"
    ports: []
    tmpfs:
      - /tmp:rw,nosuid,noexec,mode=1777,size=16m
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - artifacts_data:/var/lib/browser-use/artifacts
      # Shared with browser for download ingestion (session manager downloads_path).
      - browser_downloads:/data/downloads
    secrets:
      - postgres_password
      - audit_signing_key
      - audit_signing_public_key
      - jev_api_key
      - openrouter_api_key
    networks:
      - traefik_proxy
      - default
    depends_on:
      db:
        condition: service_healthy
      # CDP peer on the internal network. Controller can start without Chrome when
      # using compose control; healthy browser is the default warm path.
      browser:
        condition: service_healthy
        required: false

  # Internal Chromium/CDP worker + Xvfb/x11vnc. Not on traefik_proxy; CDP/VNC
  # are not host-published. Live HTTP view is the sibling `novnc` service.
  # Hardening: limits-xxlarge (not hardened-*) — see docs/browser-runtime.md.
  browser:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: limits-xxlarge
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: ghcr.io/enucatl/browser-use-browser:latest
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
      # Moby default seccomp plus the namespace calls required by Chromium's sandbox.
      - seccomp:./seccomp-chromium.json
    shm_size: "2gb"
    cpu_shares: 1024
    environment:
      - TZ=Europe/Zurich
      - CHROME_USER_DATA_DIR=/data/chrome-profiles/default
      # T022 view-only; interactive takeover is T023.
      - VNC_VIEW_ONLY=${VNC_VIEW_ONLY:-true}
      - CHROMIUM_FLAGS=--disable-gpu --disable-dev-shm-usage
    restart: unless-stopped
    # Intentionally empty: do not publish CDP (9222) or VNC (5900) to the host.
    ports: []
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
    volumes:
      - chrome_profiles:/data/chrome-profiles
      - browser_downloads:/data/downloads
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - default
      - browser_egress

  # Optional isolated worker for smoke/test runs. Start with:
  # docker compose --profile test up -d browser-test
  browser-test:
    extends:
      service: browser
    profiles: [test]
    environment:
      - CHROME_USER_DATA_DIR=/data/chrome-profiles/testing

  # Authelia-gated noVNC HTTP edge. Joins traefik_proxy for /vnc only; bridges
  # to browser:5900 on the internal network. CDP never touches this service.
  # Hardening: hardened-tiny + /tmp tmpfs — see docs/live-view.md.
  novnc:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-tiny
    build:
      context: .
      dockerfile: Dockerfile.novnc
    image: ghcr.io/enucatl/browser-use-novnc:latest
    user: "1000:1000"
    environment:
      - TZ=Europe/Zurich
    restart: unless-stopped
    ports: []
    tmpfs:
      - /tmp:rw,nosuid,noexec,mode=1777,size=16m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Higher priority than the controller Host() rule so /vnc is not swallowed.
      - "traefik.http.routers.browser-use-vnc.rule=Host(`browser-use.${DOCKER_DOMAIN}`) && PathPrefix(`/vnc/`)"
      - "traefik.http.routers.browser-use-vnc.entrypoints=https"
      - "traefik.http.routers.browser-use-vnc.tls=true"
      - "traefik.http.routers.browser-use-vnc.priority=200"
      - "traefik.http.routers.browser-use-vnc.middlewares=browser-use-vnc-strip,authelia@docker,secured@file"
      - "traefik.http.routers.browser-use-vnc.service=browser-use-vnc"
      - "traefik.http.middlewares.browser-use-vnc-strip.stripprefix.prefixes=/vnc"
      - "traefik.http.services.browser-use-vnc.loadbalancer.server.port=6080"
      # Canonicalize the bare path so relative noVNC assets resolve below /vnc/.
      - "traefik.http.routers.browser-use-vnc-slash.rule=Host(`browser-use.${DOCKER_DOMAIN}`) && Path(`/vnc`)"
      - "traefik.http.routers.browser-use-vnc-slash.entrypoints=https"
      - "traefik.http.routers.browser-use-vnc-slash.tls=true"
      - "traefik.http.routers.browser-use-vnc-slash.priority=210"
      - "traefik.http.routers.browser-use-vnc-slash.service=noop@internal"
      - "traefik.http.routers.browser-use-vnc-slash.middlewares=browser-use-vnc-slash"
      - "traefik.http.middlewares.browser-use-vnc-slash.redirectregex.regex=^https?://([^/]+)/vnc$"
      - "traefik.http.middlewares.browser-use-vnc-slash.redirectregex.replacement=https://$${1}/vnc/"
    networks:
      - traefik_proxy
      - default
    depends_on:
      browser:
        condition: service_healthy

  db:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      - TZ=Europe/Zurich
      - POSTGRES_DB=browser_use
      - POSTGRES_USER=browser_use
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
    secrets:
      - postgres_password
    networks:
      - default

  minio:
    image: minio/minio:latest
    profiles: [minio]
    command:
      - /bin/sh
      - -ec
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_access_key)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --console-address ":9001"
    restart: unless-stopped
    ports: []
    volumes:
      - minio_data:/data
    secrets:
      - minio_access_key
      - minio_secret_key
    networks:
      - default

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  audit_signing_key:
    file: ./secrets/audit_signing_key
  audit_signing_public_key:
    file: ./secrets/audit_signing_public_key
  jev_api_key:
    file: ./secrets/jev_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  minio_access_key:
    file: ./secrets/minio_access_key
  minio_secret_key:
    file: ./secrets/minio_secret_key

networks:
  default:
    internal: true
  # Browser-only outbound access; the default service network stays internal.
  browser_egress: {}
  traefik_proxy:
    external: true

volumes:
  pgdata:
  chrome_profiles:
  browser_downloads:
  # Content-addressed audit blobs (screenshots, state, downloads). Controller only;
  # never publish this path via Traefik. See docs/artifacts.md.
  artifacts_data:
  minio_data:
