services:
  controller:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
    image: ghcr.io/enucatl/browser-use:latest
    cpu_shares: 512
    extra_hosts:
      - "${DOCKER_DOMAIN}:host-gateway"
      - "docker-host.internal:host-gateway"
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - BROWSER_USE_HOST=browser-use.${DOCKER_DOMAIN}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-browser_use}
      - DATABASE_USER=${DATABASE_USER:-browser_use}
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      # Content-addressed blobs; not exposed via Traefik (see docs/artifacts.md).
      - ARTIFACTS_ROOT=/var/lib/browser-use/artifacts
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.browser-use.rule=Host(`browser-use.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.browser-use.entrypoints=https"
      - "traefik.http.routers.browser-use.tls=true"
      - "traefik.http.routers.browser-use.middlewares=authelia@docker,secured@file"
      - "traefik.http.services.browser-use.loadbalancer.server.port=8000"
    ports: []
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,noexec,mode=1777,size=16m
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - artifacts_data:/var/lib/browser-use/artifacts
    secrets:
      - postgres_password
    networks:
      - traefik_proxy
      - default
    depends_on:
      db:
        condition: service_healthy

  # Internal Chromium/CDP worker. Not on traefik_proxy; CDP is not host-published.
  # Hardening: limits-xlarge (not hardened-*) — see docs/browser-runtime.md.
  browser:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: limits-xlarge
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        VERSION: ${VERSION:-0.0.0}
    image: ghcr.io/enucatl/browser-use-browser:latest
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    shm_size: "2gb"
    cpu_shares: 1024
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - CDP_PORT=${CDP_PORT:-9222}
      - CHROME_USER_DATA_DIR=/data/chrome-profile
      - CHROME_DOWNLOAD_DIR=/data/downloads
      # Required in Docker without Chrome user-namespace sandbox support.
      - CHROMIUM_FLAGS=--no-sandbox --disable-gpu --disable-dev-shm-usage
    restart: unless-stopped
    # Intentionally empty: do not publish CDP to the host.
    ports: []
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
    volumes:
      - chrome_profile:/data/chrome-profile
      - browser_downloads:/data/downloads
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - default

  db:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - POSTGRES_DB=${DATABASE_NAME:-browser_use}
      - POSTGRES_USER=${DATABASE_USER:-browser_use}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
    secrets:
      - postgres_password
    networks:
      - default

secrets:
  postgres_password:
    file: ./secrets/postgres_password

networks:
  default:
    internal: true
  traefik_proxy:
    external: true

volumes:
  pgdata:
  chrome_profile:
  browser_downloads:
  # Content-addressed audit blobs (screenshots, state, downloads). Controller only;
  # never publish this path via Traefik. See docs/artifacts.md.
  artifacts_data:
