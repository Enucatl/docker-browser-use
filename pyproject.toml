[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-git-versioning>=3.0,<4",
]
build-backend = "setuptools.build_meta"

[project]
name = "browser-use-agent"
dynamic = ["version"]
description = "Always-on self-hosted browser-agent service"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Enucatl", email = "1423701+Enucatl@users.noreply.github.com" },
]
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "browser-use>=0.13.0",
    "cryptography>=50.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "niquests>=3.14.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
evaluate-jev = "browser_use_agent.eval.jev_replay:main"
verify-audit = "browser_use_agent.audit.signed_checkpoints:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live Compose CDP (browser:9222); skipped unless BROWSER_CDP_URL is reachable",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]
