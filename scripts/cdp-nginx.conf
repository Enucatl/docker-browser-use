# Minimal CDP front proxy: Chromium DevTools stays on 127.0.0.1:9223;
# peers reach this listener on 0.0.0.0:9222 with Host rewritten to localhost.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 9222;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:9223;
            proxy_http_version 1.1;
            # Include the loopback DevTools port so webSocketDebuggerUrl keeps :9223
            # (clients rewrite host→browser:9222). Bare "127.0.0.1" omits the port.
            proxy_set_header Host 127.0.0.1:9223;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
